[package]
name = "tla-mc"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A fast TLA+ model checker: compiles a spec into a native, parallel checker; state counts measured exact against TLC"
license = "MIT"
repository = "https://github.com/ddalton/tla-mc"
readme = "README.md"
keywords = ["tla-plus", "tlaplus", "model-checker", "formal-verification", "tla"]
categories = ["development-tools", "command-line-utilities"]
exclude = ["results/"]

# Standalone: not a member of any enclosing workspace.
[workspace]

[dependencies]
mimalloc = { version = "0.1", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
